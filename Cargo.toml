[package]
name = "mosty"
version = "0.1.0"
description = "mosty: MOu Seiseki Teisei ha Yadayo"
edition = "2024"

[dependencies]
calamine = "0.36.1"
clap = { version = "4.6.6", features = ["derive"] }
