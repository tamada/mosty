name: build
on:
  push:
    branches:
      - "**"
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Let the other OSes finish when one fails, so that a failure on Windows
      # does not hide whether the others pass.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    # The default shell on Windows is PowerShell, which does not stop at a
    # failing command in the middle of a multi-line run.
    defaults:
      run:
        shell: bash
    steps:
      - name: setup rust
        run: |
          rustup update stable

      - name: checkout
        uses: actions/checkout@v6

      - name: build
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

      - name: Convert coverage format to lcov
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-llvm-cov
          rustup component add llvm-tools-preview
          cargo llvm-cov --lcov --output-path coverage.lcov

      - name: coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.github_token }}
          path-to-lcov: coverage.lcov
        if: matrix.os == 'ubuntu-latest'
